<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Energy 3D Monitor - Solax, Octopus & Peugeot EV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-nav {
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 22px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }

    .brand-badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Main Container */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 18px 16px 18px;
      margin: 0 auto;
      width: 100%;
      height: calc(100vh - 65px);
      min-height: 0;
    }

    /* 3D Card Stage */
    .card-stage {
      background: #070b14;
      border: 1px solid #1e293b;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      width: 100%;
    }

    :fullscreen, :-webkit-full-screen {
      width: 100vw;
      height: 100vh;
    }

    :fullscreen .app-main, :-webkit-full-screen .app-main {
      padding: 6px 12px 10px 12px;
      height: calc(100vh - 58px);
    }

    :fullscreen .card-stage, :-webkit-full-screen .card-stage {
      border-radius: 12px;
    }

    #energy-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* Simulation Control Deck */
    .sim-deck {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

  </style>

  <!-- Load bundled custom card modules with cache-buster -->
  <script type="module" src="./dist/ha-energy-3d-card.js?v=1.2.20"></script>
  <script type="module" src="./dist/ha-energy-flow-card.js?v=1.2.20"></script>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-brand">
      <div class="brand-logo">🏡⚡</div>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="brand-title">Home Energy Monitor</span>
          <span class="brand-badge" id="app-mode-badge">App</span>
        </div>
        <div style="font-size: 11px; color: #64748b;">Taylor Wimpey Blair TK Semi-Detached House Model</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <!-- 3D vs 2D View Switcher -->
      <div class="view-switcher" style="display: inline-flex; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 9999px; padding: 3px; gap: 4px;">
        <button id="view-btn-3d" type="button" style="background: #3b82f6; color: #ffffff; border: none; padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">🏡 3D House</button>
        <button id="view-btn-flow" type="button" style="background: transparent; color: #94a3b8; border: none; padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">⚡ 2D Live Flow</button>
      </div>

      <!-- Fullscreen Toggle Button -->
      <button id="nav-btn-fullscreen" type="button" title="Toggle Fullscreen" style="display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.08); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.14); padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
        <span id="nav-fs-icon">⛶</span>
        <span id="nav-fs-text">Fullscreen</span>
      </button>

      <div class="status-pill" id="ha-conn-pill">
        <div class="status-dot" id="ha-conn-dot"></div>
        <span id="ha-conn-text">Checking Home Assistant...</span>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <!-- Lovelace Card Stage -->
    <div class="card-stage">
      <ha-energy-3d-card id="energy-card"></ha-energy-3d-card>
      <ha-energy-flow-card id="energy-flow-card" style="display: none; width: 100%; height: 100%; flex: 1; min-height: 0;"></ha-energy-flow-card>
    </div>
  </main>

  <!-- Interactive & Live HA Polling Script -->
  <script type="module">
    const card3D = document.getElementById('energy-card');
    const cardFlow = document.getElementById('energy-flow-card');
    const btn3D = document.getElementById('view-btn-3d');
    const btnFlow = document.getElementById('view-btn-flow');
    const btnNavFs = document.getElementById('nav-btn-fullscreen');
    const navFsText = document.getElementById('nav-fs-text');
    const navFsIcon = document.getElementById('nav-fs-icon');

    // Fullscreen Toggle Logic
    btnNavFs.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn(err));
      } else {
        document.exitFullscreen().catch(err => console.warn(err));
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      navFsIcon.textContent = isFs ? '✕' : '⛶';
      navFsText.textContent = isFs ? 'Exit Fullscreen' : 'Fullscreen';
      btnNavFs.style.background = isFs ? '#3b82f6' : 'rgba(255, 255, 255, 0.08)';
    });

    // Switcher Logic
    btn3D.addEventListener('click', () => {
      card3D.style.display = 'flex';
      cardFlow.style.display = 'none';
      btn3D.style.background = '#3b82f6';
      btn3D.style.color = '#ffffff';
      btnFlow.style.background = 'transparent';
      btnFlow.style.color = '#94a3b8';
    });

    btnFlow.addEventListener('click', () => {
      card3D.style.display = 'none';
      cardFlow.style.display = 'flex';
      btnFlow.style.background = '#3b82f6';
      btnFlow.style.color = '#ffffff';
      btn3D.style.background = 'transparent';
      btn3D.style.color = '#94a3b8';
    });

    // Configure 3D card
    card3D.setConfig({
      model_url: 'Taylor_Wimpey_Blair.glb',
      height: '100%',
      title: 'Taylor Wimpey Blair TK - Energy 3D'
    });

    // Configure 2D flow card
    cardFlow.setConfig({
      title: 'Live Energy Flow',
      solar_entity: 'sensor.solax_snm9wncrqy_pv1_power',
      grid_import_entity: 'sensor.octopus_energy_electricity_22l3956422_3200000391421_current_demand',
      grid_export_entity: 'sensor.solax_snm9wncrqy_exported_power',
      ev_entity: 'input_number.zappi_ev_power',
      tv_entity: 'sensor.living_room_tv_plug_power',
      lights_entity: 'input_number.matter_lights_power',
      fridge_entity: 'sensor.refrigerator_power'
    });

    // Mock Home Assistant states object for fallback
    let currentHass = {
      states: {
        'sensor.solax_snm9wncrqy_pv1_power': { state: '2450', attributes: { unit_of_measurement: 'W' } },
        'sensor.octopus_energy_electricity_22l3956422_3200000391421_current_demand': { state: '380', attributes: { unit_of_measurement: 'W' } },
        'sensor.solax_snm9wncrqy_exported_power': { state: '0', attributes: { unit_of_measurement: 'W' } },
        'input_number.zappi_ev_power': { state: '1400', attributes: { unit_of_measurement: 'W' } },
        'sensor.living_room_tv_plug_power': { state: '115', attributes: { unit_of_measurement: 'W' } },
        'input_number.matter_lights_power': { state: '28', attributes: { unit_of_measurement: 'W' } },
        'sensor.refrigerator_power': { state: '42', attributes: { unit_of_measurement: 'W' } },

        'sensor.solax_pv_power_total': { state: '2.85' },
        'sensor.solax_today_s_solar_energy': { state: '14.6' },
        'sensor.solax_this_week_solar_energy': { state: '86.4' },
        'sensor.solax_this_month_solar_energy': { state: '342.1' },
        'sensor.solax_this_year_solar_energy': { state: '3820' },
        'sensor.octopus_home_mini_current_electricity_power': { state: '0.72' },
        'sensor.solax_feed_in_power': { state: '0.0' },
        'sensor.octopus_energy_electricity_current_rate': { state: '24.85' },
        'sensor.octopus_energy_electricity_current_month_cost': { state: '74.20' },
        'sensor.octopus_home_mini_electricity_30min': { state: '0.36' },
        'sensor.octopus_energy_electricity_day': { state: '8.4' },
        'sensor.octopus_energy_electricity_week': { state: '54.2' },
        'sensor.octopus_energy_electricity_month': { state: '218.6' },
        'sensor.boiler_status': { state: 'Standby' },
        'sensor.octopus_home_mini_gas_30min': { state: '0.72' },
        'sensor.octopus_energy_gas_day': { state: '12.8' },
        'sensor.octopus_energy_gas_week': { state: '78.5' },
        'sensor.octopus_energy_gas_month': { state: '310.2' },
        'sensor.octopus_energy_gas_current_rate': { state: '6.24' },
        'sensor.octopus_energy_gas_current_month_cost': { state: '38.65' },
        'sensor.myenergi_zappi_power': { state: '7.20' },
        'sensor.myenergi_zappi_status': { state: 'Charging' },
        'sensor.myenergi_zappi_charge_added_session': { state: '22.4' },
        'sensor.e2008_battery_level': { state: '68' },
        'sensor.e2008_battery_range': { state: '142' },
        'button.vr3ukzkxzmj557948_wakeup': { state: 'idle' },

        // Appliances & Living Room Devices
        'sensor.refrigerator_power': { state: '37', attributes: { unit_of_measurement: 'W' } },
        'sensor.refrigerator_fridge_temperature': { state: '1' },
        'sensor.refrigerator_freezer_temperature': { state: '-18' },
        'sensor.fridge_power': { state: '37', attributes: { unit_of_measurement: 'W' } },
        'sensor.washing_machine_power': { state: '420', attributes: { unit_of_measurement: 'W' } },
        'media_player.living_room_tv': { state: 'on', attributes: { friendly_name: 'Living Room TV' } },
        'light.living_room_lamp': { state: 'on', attributes: { brightness: 220, rgb_color: [255, 220, 160] } },

        // Thermostats
        'climate.downstairs': {
          state: 'heat',
          attributes: { current_temperature: 20.5, temperature: 21.0, hvac_action: 'heating' }
        },
        'climate.upstairs': {
          state: 'heat',
          attributes: { current_temperature: 19.5, temperature: 19.5, hvac_action: 'idle' }
        },

        // Room Lights
        'light.living_room': { state: 'on', attributes: { brightness: 255 } },
        'light.kitchen': { state: 'on', attributes: { brightness: 255 } },
        'light.dining_room': { state: 'off', attributes: { brightness: 0 } },
        'light.hallway': { state: 'on', attributes: { brightness: 200 } },
        'light.downstairs_wc': { state: 'off', attributes: { brightness: 0 } },
        'light.master_bedroom': { state: 'off', attributes: { brightness: 0 } },
        'light.ensuite': { state: 'off', attributes: { brightness: 0 } },
        'light.bedroom_2': { state: 'off', attributes: { brightness: 0 } },
        'light.bedroom_3': { state: 'off', attributes: { brightness: 0 } },
        'light.family_bathroom': { state: 'off', attributes: { brightness: 0 } },
        'light.landing': { state: 'off', attributes: { brightness: 0 } }
      }
    };

    const callServiceFn = async (domain, service, serviceData) => {
      try {
        const res = await fetch('api/ha-service', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ domain, service, serviceData })
        });
        return await res.json();
      } catch (e) {
        console.warn('callService error:', e);
      }
    };

    currentHass.callService = callServiceFn;
    card3D.hass = currentHass;
    cardFlow.hass = currentHass;

    // Check Home Assistant Live API (Add-on Mode)
    const connDot = document.getElementById('ha-conn-dot');
    const connText = document.getElementById('ha-conn-text');

    async function checkHALive() {
      try {
        const res = await fetch('api/ha-states');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();

        if (data.states && Array.isArray(data.states) && data.states.length > 0) {
          // Connected to Home Assistant Live!
          connDot.style.background = '#10b981';
          connText.innerText = 'Home Assistant Live (Connected)';

          const statesMap = {};
          for (const s of data.states) {
            statesMap[s.entity_id] = s;
          }

          currentHass = { states: statesMap, callService: callServiceFn };
          card3D.hass = currentHass;
          cardFlow.hass = currentHass;
          return;
        }
      } catch (e) {
        // Standalone or local preview mode
      }

      connDot.style.background = '#38bdf8';
      connText.innerText = 'Demo / Standalone Mode';
    }

    checkHALive();
    setInterval(checkHALive, 3000);
  </script>
</body>
</html>
